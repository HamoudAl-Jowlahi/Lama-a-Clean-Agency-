<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة — لمعة</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  body { font-size: 14px; line-height: 22px; background: var(--n-50); }
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

  /* Sidebar */
  .side { background: var(--n-0); border-inline-end: 1px solid var(--color-border); display: flex; flex-direction: column;
          position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px; font-weight: 700; border-bottom: 1px solid var(--n-100); }
  .logo { width: 32px; height: 32px; border-radius: var(--r-md); background: var(--color-primary); color: #fff; display: grid; place-items: center; }
  .side nav { padding: 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .side .grp { font-size: 11px; color: var(--n-400); padding: 12px 10px 4px; font-weight: 600; }
  .side nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--n-700); cursor: pointer; }
  .side nav a:hover { background: var(--n-50); }
  .side nav a.on { background: var(--blue-50); color: var(--blue-700); font-weight: 600; }
  .side nav a .cnt { margin-inline-start: auto; font-size: 11px; background: var(--color-primary); color: #fff; border-radius: 999px; padding: 0 7px; line-height: 18px; }
  .side-foot { padding: 12px 18px; border-top: 1px solid var(--n-100); display: flex; align-items: center; gap: 10px; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 10; height: 60px; background: var(--n-0); border-bottom: 1px solid var(--color-border);
         display: flex; align-items: center; gap: 12px; padding: 0 24px; }
  .top h1 { font-size: 18px; font-weight: 600; flex: 1; }
  .top .search { width: 280px; }
  .menu-btn { display: none; }
  .content { padding: 24px; max-width: 1320px; }

  /* Common */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .kpi { background: var(--n-0); border: 1px solid var(--color-border); border-radius: var(--r-lg); padding: 16px; }
  .kpi .v { font-size: 26px; line-height: 32px; font-weight: 700; margin-top: 4px; }
  .kpi .d { font-size: 12px; color: var(--n-500); }
  .panel { background: var(--n-0); border: 1px solid var(--color-border); border-radius: var(--r-lg); }
  .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--n-100); flex-wrap: wrap; }
  .panel-h h2 { font-size: 15px; font-weight: 600; }
  .panel-b { padding: 16px; }
  .cols-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar .grow { flex: 1; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs .chip { height: 32px; font-size: 13px; }
  .tabs .chip .n { color: var(--n-500); font-weight: 400; }

  .tbl-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th { text-align: start; font-weight: 600; color: var(--n-600); background: var(--n-25); padding: 10px 16px; border-bottom: 1px solid var(--color-border); white-space: nowrap; font-size: 12.5px; }
  .tbl td { padding: 11px 16px; border-bottom: 1px solid var(--n-100); white-space: nowrap; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr.click { cursor: pointer; }
  .tbl tbody tr.click:hover td { background: var(--blue-50); }
  .tbl .sub { display: block; font-size: 12px; color: var(--n-500); }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid var(--n-100); font-size: 12.5px; color: var(--n-500); }

  .bar-row { display: grid; grid-template-columns: 110px 1fr 36px; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .bar-track { height: 8px; background: var(--n-100); border-radius: 4px; overflow: hidden; }
  .bar-track span { display: block; height: 100%; border-radius: 4px; }
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 10px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--n-500); }
  .chart .col span { width: 100%; max-width: 36px; background: var(--blue-500); border-radius: 4px 4px 0 0; }
  .chart .col b { font-size: 11px; color: var(--n-700); font-weight: 600; }

  .toggle { width: 36px; height: 20px; border-radius: 10px; background: var(--n-300); position: relative; display: inline-block; cursor: pointer; vertical-align: middle; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 2px; inset-inline-end: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
  .toggle.on { background: var(--color-primary); }
  .toggle.on::after { inset-inline-end: 18px; }

  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .input { height: 40px; }
  .settings-sec { margin-bottom: 16px; }

  /* Drawer */
  .drawer-scrim { position: fixed; inset: 0; background: rgba(20,25,34,.4); z-index: 40; display: none; }
  .drawer { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: 480px; max-width: 100%; background: var(--n-0); z-index: 41;
            box-shadow: var(--shadow-overlay); display: none; flex-direction: column; }
  .drawer.open, .drawer-scrim.open { display: flex; }
  .drawer-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--n-100); }
  .drawer-b { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .drawer-f { padding: 12px 16px; border-top: 1px solid var(--n-100); display: flex; gap: 8px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13.5px; }
  .kv span:first-child { color: var(--n-500); }
  .worker-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--r-md); cursor: pointer; }
  .worker-opt.sel { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary); }
  .worker-opt.busy { opacity: .55; cursor: not-allowed; }
  .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--n-300); flex: none; }
  .sel .radio { border: 5px solid var(--color-primary); }

  /* Complaints split */
  .split { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; }
  .c-item { padding: 12px 16px; border-bottom: 1px solid var(--n-100); cursor: pointer; }
  .c-item.on { background: var(--blue-50); }
  .thread { display: flex; flex-direction: column; gap: 10px; }
  .msg { border-radius: 12px; padding: 10px 12px; max-width: 80%; font-size: 13.5px; }
  .msg small { display: block; font-size: 11.5px; color: var(--n-500); margin-top: 2px; }
  .msg.cust { background: var(--n-50); align-self: flex-start; }
  .msg.adm { background: var(--blue-50); align-self: flex-end; }
  .msg.note { background: var(--warning-50); align-self: stretch; max-width: none; border: 1px dashed #E3C77E; }
  .sys { align-self: center; font-size: 12px; color: var(--n-500); }

  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-2, .split { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: fixed; inset-block: 0; inset-inline-start: 0; width: 260px; z-index: 50; transform: translateX(100%); transition: transform .2s; box-shadow: var(--shadow-overlay); }
    .side.open { transform: none; }
    .menu-btn { display: inline-grid; place-items: center; }
    .top { padding: 0 16px; }
    .top .search { display: none; }
    .content { padding: 16px; }
    .form-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) { .kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi .v { font-size: 20px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-brand"><span class="logo"><svg class="brand-mark"><use href="#brand-mark"/></svg></span><span class="stack"><span>لمعة</span><span class="t-xs muted" style="font-weight:400">لوحة الإدارة</span></span></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span class="avatar" style="width:34px;height:34px">م</span><div class="stack" style="flex:1"><b class="t-sm">مدير العمليات</b><span class="t-xs muted">operations</span></div><button class="btn-icon" style="width:34px;height:34px" title="خروج"><svg class="i"><use href="#i-logout"/></svg></button></div>
  </aside>

  <div style="min-width:0">
    <header class="top">
      <button class="btn-icon menu-btn" id="menuBtn" aria-label="القائمة"><svg class="i"><use href="#i-menu"/></svg></button>
      <h1 id="title">لوحة التحكم</h1>
      <div class="input input-sm search"><svg class="i i-sm"><use href="#i-search"/></svg><input placeholder="بحث برقم الطلب أو اسم العميل"></div>
      <button class="btn-icon" aria-label="الإشعارات"><svg class="i"><use href="#i-bell"/></svg></button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="drawer-scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script src="assets/icons.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
